<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            width: 300px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #1da1f2;
        }
        input:checked + .slider:before {
            transform: translateX(24px);
        }
        .label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        .status {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 16px;
        }
        .setting-group {
            margin-bottom: 12px;
        }
        .setting-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            color: #333;
        }
        .setting-group input {
            width: 100%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .help-text {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }
        .save-btn {
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 9999px;
            padding: 8px 16px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 8px;
        }
        .save-btn:hover {
            background-color: #1a91da;
        }
        .save-status {
            display: none;
            text-align: center;
            color: #4caf50;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="switch-container">
        <span class="label">Quick Buy Button</span>
        <label class="switch">
            <input type="checkbox" id="toggleButton">
            <span class="slider"></span>
        </label>
    </div>
    <div class="status" id="status">Extension is disabled</div>

    <div class="setting-group">
        <label for="defaultSolAmount">Default SOL Amount</label>
        <input type="number" id="defaultSolAmount" step="any" min="0" value="0.5">
        <div class="help-text">Amount of SOL to buy with (any amount > 0)</div>
    </div>

    <div class="setting-group">
        <label for="priorityFee">Priority Fee (SOL)</label>
        <input type="number" id="priorityFee" step="0.0001" min="0" value="0.0001">
        <div class="help-text">Transaction priority fee in SOL</div>
    </div>

    <div class="setting-group">
        <label for="bribeFee">Bribe Fee (SOL)</label>
        <input type="number" id="bribeFee" step="0.0001" min="0" value="0.0001">
        <div class="help-text">MEV bribe fee in SOL</div>
    </div>

    <div class="setting-group">
        <label for="slippage">Slippage (%)</label>
        <input type="number" id="slippage" step="1" min="1" max="100" value="30">
        <div class="help-text">Maximum price slippage percentage (1-100)</div>
    </div>

    <button id="saveSettings" class="save-btn">Save Settings</button>
    <div id="saveStatus" class="save-status">Settings saved!</div>

    <script src="popup.js"></script>
</body>
</html>
